/* ========= LÓGICA ========= */
const cont = document.getElementById('quiz');
const marcador = document.getElementById('marcador');
let respondidas = 0, aciertos = 0;

function actualizarMarcador() {
  marcador.textContent = `Respondidas: ${respondidas} / ${preguntas.length} · Aciertos: ${aciertos}`;
}

function responder(card, caja, exp, p, elegida) {
  if (card.dataset.respondida) return;
  card.dataset.respondida = "1";
  caja.querySelectorAll('.opcion').forEach((b, j) => {
    b.disabled = true;
    if (j === p.ok) b.classList.add('correcta');
    if (j === elegida && elegida !== p.ok) b.classList.add('incorrecta');
  });
  const acerto = elegida === p.ok;
  respondidas++;
  if (acerto) aciertos++;
  actualizarMarcador();
  exp.innerHTML = `<strong>${acerto ? '✅ ¡Correcto!' : '❌ Respuesta incorrecta.'}</strong> ${p.exp}`;
  exp.classList.add('visible');
}

function construir() {
  cont.innerHTML = "";
  respondidas = 0; aciertos = 0;
  actualizarMarcador();

  preguntas.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card ' + p.tipo;

    const cab = document.createElement('div');
    cab.className = 'cabecera';
    cab.innerHTML =
      `<div class="numero">${i + 1}</div>
       <span class="etiqueta ${p.tipo === 'caso' ? 'c' : 't'}">
         ${p.tipo === 'caso' ? 'Caso clínico' : 'Teoría'}
       </span>
       <span class="etiqueta materia">${p.cat}</span>`;
    card.appendChild(cab);

    const enun = document.createElement('p');
    enun.className = 'enunciado';
    enun.textContent = p.q;
    card.appendChild(enun);

    const caja = document.createElement('div');
    caja.className = 'opciones';
    const exp = document.createElement('div');
    exp.className = 'explicacion';

    p.ops.forEach((op, j) => {
      const b = document.createElement('button');
      b.className = 'opcion';
      b.innerHTML = `<span class="letra">${'ABCD'[j]}</span><span>${op}</span>`;
      b.addEventListener('click', () => responder(card, caja, exp, p, j));
      caja.appendChild(b);
    });

    card.appendChild(caja);
    card.appendChild(exp);
    cont.appendChild(card);
  });
}

/* Diagnóstico: cuenta distribución de letras y patrones de longitud */
(function(){
  const letras = {A:0, B:0, C:0, D:0};
  let masLarga=0, masCorta=0, intermedia=0;
  preguntas.forEach(p => {
    letras['ABCD'[p.ok]]++;
    const largos = p.ops.map(o => o.length);
    const lc = largos[p.ok];
    const max = Math.max(...largos);
    const min = Math.min(...largos);
    if (lc === max) masLarga++;
    else if (lc === min) masCorta++;
    else intermedia++;
  });
  console.log('Distribución de letras:', letras);
  console.log('Correcta más larga:', masLarga, '| más corta:', masCorta, '| intermedia:', intermedia);
})();

construir();
</script>
