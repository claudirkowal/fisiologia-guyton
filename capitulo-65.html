<script>
const preguntas = [

/* =========================================================
   PRINCIPIOS GENERALES E HIDRÓLISIS (1-12)
   ========================================================= */
{ cat:"Principios generales", tipo:"teoria",
  q:"¿Cuál es el proceso químico básico común a la digestión de carbohidratos, grasas y proteínas?",
  ops:["La hidrólisis","La oxidación","La fermentación","La fosforilación"],
  ok:0,
  exp:"La hidrólisis es el proceso básico de la digestión: las enzimas devuelven iones H y OH del agua a los polímeros, separándolos en sus unidades constituyentes. Es común a los tres macronutrientes." },

{ cat:"Principios generales", tipo:"teoria",
  q:"Los triglicéridos están formados por:",
  ops:["Glicerol y tres ácidos grasos","Glucosa y fructosa","Aminoácidos unidos por enlaces peptídicos","Colesterol y fosfolípidos"],
  ok:0,
  exp:"Los triglicéridos (grasas neutras) son combinaciones de tres moléculas de ácidos grasos condensadas con una molécula de glicerol. Su digestión libera los ácidos grasos por hidrólisis." },

{ cat:"Principios generales", tipo:"teoria",
  q:"Las proteínas están formadas por aminoácidos unidos mediante:",
  ops:["Enlaces peptídicos","Enlaces glucosídicos","Enlaces éster","Puentes disulfuro"],
  ok:0,
  exp:"Los aminoácidos se unen por enlaces peptídicos. La hidrólisis de estos enlaces por enzimas proteolíticas libera los aminoácidos libres." },

{ cat:"Principios generales", tipo:"teoria",
  q:"Los carbohidratos de la dieta son principalmente:",
  ops:["Monosacáridos libres","Polisacáridos y disacáridos","Ácidos grasos","Aminoácidos"],
  ok:1,
  exp:"Casi todos los carbohidratos de los alimentos son polisacáridos (almidones) o disacáridos (sacarosa, lactosa), formados por monosacáridos unidos por condensación." },

{ cat:"Principios generales", tipo:"teoria",
  q:"La mucosa gastrointestinal no puede absorber los macronutrientes en su forma natural porque:",
  ops:["Son demasiado grandes y necesitan hidrólisis previa","Son tóxicos sin digerir","No son solubles en agua","Carecen de transportadores"],
  ok:0,
  exp:"Los macronutrientes deben ser hidrolizados a sus unidades absorbibles (monosacáridos, aminoácidos, ácidos grasos) antes de poder atravesar la mucosa intestinal." },

{ cat:"Principios generales", tipo:"teoria",
  q:"Las enzimas digestivas son de naturaleza:",
  ops:["Lipídica","Proteica","Glucídica","Mineral"],
  ok:1,
  exp:"Todas las enzimas digestivas son proteínas secretadas por las glándulas gastrointestinales. Actúan como catalizadores de las reacciones de hidrólisis." },

{ cat:"Principios generales", tipo:"caso",
  q:"Paciente con pancreatitis crónica que presenta malabsorción global. ¿Qué proceso está alterado?",
  ops:["La hidrólisis enzimática de los nutrientes","La absorción de agua","La motilidad gástrica","La secreción de bilis"],
  ok:0,
  exp:"La pancreatitis crónica reduce la secreción de enzimas pancreáticas (lipasa, proteasas, amilasa), lo que altera la hidrólisis de grasas, proteínas y carbohidratos, causando malabsorción." },

{ cat:"Principios generales", tipo:"teoria",
  q:"La condensación de monosacáridos para formar polisacáridos implica:",
  ops:["La eliminación de una molécula de agua","La adición de una molécula de agua","La oxidación de la glucosa","La fosforilación"],
  ok:0,
  exp:"La condensación une monosacáridos eliminando una molécula de agua por enlace. La digestión invierte este proceso mediante hidrólisis." },

{ cat:"Principios generales", tipo:"teoria",
  q:"El producto final de la digestión de los carbohidratos es:",
  ops:["Maltosa","Monosacáridos","Almidón","Glucógeno"],
  ok:1,
  exp:"La digestión de los carbohidratos termina en monosacáridos (glucosa, galactosa y fructosa), que son hidrosolubles y se absorben de inmediato hacia la sangre portal." },

{ cat:"Principios generales", tipo:"caso",
  q:"Paciente con fibrosis quística que presenta esteatorrea. ¿Qué mecanismo explica la malabsorción de grasas?",
  ops:["Obstrucción de los conductos pancreáticos","Exceso de sales biliares","Aumento de la motilidad intestinal","Deficiencia de lactasa"],
  ok:0,
  exp:"La fibrosis quística produce moco espeso que obstruye los conductos pancreáticos, impidiendo la llegada de la lipasa pancreática al duodeno. Sin lipasa, los triglicéridos no se hidrolizan y aparecen en las heces (esteatorrea)." },

{ cat:"Principios generales", tipo:"teoria",
  q:"La digestión de las grasas requiere inicialmente:",
  ops:["Emulsificación por sales biliares","Hidrólisis por amilasa","Desnaturalización por ácido","Fosforilación"],
  ok:0,
  exp:"Las grasas deben ser emulsificadas por las sales biliares para reducir el tamaño de los glóbulos lipídicos y aumentar la superficie de acción de la lipasa pancreática, que es hidrosoluble." },

{ cat:"Principios generales", tipo:"teoria",
  q:"La lipasa pancreática hidroliza los triglicéridos en:",
  ops:["Ácidos grasos y monoglicéridos","Glucosa y galactosa","Aminoácidos libres","Colesterol libre"],
  ok:0,
  exp:"La lipasa pancreática, junto con la colipasa, hidroliza los triglicéridos en ácidos grasos libres y monoglicéridos, que luego se incorporan a las micelas." },

/* =========================================================
   DIGESTIÓN DE CARBOHIDRATOS (13-28)
   ========================================================= */
{ cat:"Carbohidratos", tipo:"teoria",
  q:"¿Cuáles son las tres fuentes principales de carbohidratos en la dieta?",
  ops:["Sacarosa, lactosa y almidones","Glucosa, fructosa y galactosa","Celulosa, pectina y lignina","Amilosa, amilopectina y glucógeno"],
  ok:0,
  exp:"Las fuentes más importantes son la sacarosa (azúcar de caña), la lactosa (azúcar de la leche) y los almidones (polisacáridos vegetales). Otras fuentes menores son el glucógeno, el alcohol y las pectinas." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"La ptialina salival es una enzima que:",
  ops:["Digiere proteínas","Inicia la digestión del almidón","Digiere grasas","Neutraliza el ácido"],
  ok:1,
  exp:"La ptialina (α-amilasa salival) es secretada por la glándula parótida e hidroliza el almidón en maltosa y polímeros pequeños de glucosa (3-9 moléculas)." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"¿Qué porcentaje del almidón ingerido se hidroliza en la boca antes de la deglución?",
  ops:["No más del 5%","30-40%","60-70%","90%"],
  ok:0,
  exp:"En el momento de la deglución, no más del 5% de los almidones ingeridos se encuentran ya hidrolizados, porque el tiempo de contacto con la ptialina en la boca es breve." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"La amilasa salival se inactiva en el estómago cuando el pH desciende por debajo de:",
  ops:["4","7","2","9"],
  ok:0,
  exp:"La actividad de la amilasa salival desaparece cuando el pH gástrico desciende por debajo de 4, antes de que los alimentos se mezclen completamente con las secreciones gástricas." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"La α-amilasa pancreática actúa sobre el almidón en:",
  ops:["El estómago","El duodeno y yeyuno proximal","El íleon terminal","El colon"],
  ok:1,
  exp:"La α-amilasa pancreática actúa en el duodeno y el yeyuno proximal durante 15-30 minutos, convirtiendo el almidón en maltosa y pequeños polímeros de glucosa." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"Las enzimas del borde en cepillo que hidrolizan los disacáridos son:",
  ops:["Lactasa, sacarasa, maltasa y α-dextrinasa","Pepsina, tripsina y quimotripsina","Amilasa y lipasa","Pepsina y renina"],
  ok:0,
  exp:"Los enterocitos de las vellosidades contienen lactasa, sacarasa, maltasa y α-dextrinasa, que hidrolizan los disacáridos en monosacáridos absorbibles." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"La lactosa se hidroliza en:",
  ops:["Glucosa y galactosa","Glucosa y fructosa","Dos moléculas de glucosa","Glucosa y manosa"],
  ok:0,
  exp:"La lactasa hidroliza la lactosa en una molécula de glucosa y una de galactosa." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"La sacarosa se hidroliza en:",
  ops:["Glucosa y fructosa","Glucosa y galactosa","Dos moléculas de glucosa","Fructosa y galactosa"],
  ok:0,
  exp:"La sacarasa hidroliza la sacarosa en una molécula de glucosa y una de fructosa." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"La maltosa se hidroliza en:",
  ops:["Dos moléculas de glucosa","Glucosa y galactosa","Glucosa y fructosa","Dos moléculas de fructosa"],
  ok:0,
  exp:"La maltasa hidroliza la maltosa en dos moléculas de glucosa." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"¿Qué monosacárido representa aproximadamente el 80% del producto final de la digestión de los carbohidratos?",
  ops:["Glucosa","Galactosa","Fructosa","Manosa"],
  ok:0,
  exp:"La glucosa representa alrededor del 80% del producto final de la digestión de los carbohidratos. La galactosa y la fructosa rara vez aportan más del 10% cada una." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"La celulosa no se digiere en el ser humano porque:",
  ops:["Carece de enzimas que rompan sus enlaces β-1,4","Es demasiado grande para absorberse","El pH gástrico la destruye","No contiene glucosa"],
  ok:0,
  exp:"El ser humano carece de celulasa, la enzima que hidroliza los enlaces β-1,4 de la celulosa. Por eso la celulosa llega intacta al colon y actúa como fibra dietética." },

{ cat:"Carbohidratos", tipo:"caso",
  q:"Paciente adulto que presenta diarrea y distensión abdominal tras ingerir leche. ¿Qué enzima está deficiente?",
  ops:["La sacarasa","La lactasa","La maltasa","La α-dextrinasa"],
  ok:1,
  exp:"La deficiencia de lactasa impide hidrolizar la lactosa en glucosa y galactosa. La lactosa no absorbida fermenta en el colon y causa diarrea osmótica y gases." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"La glucosa y la galactosa se absorben en el intestino delgado mediante:",
  ops:["Difusión simple","Cotransporte con sodio (SGLT1)","Difusión facilitada (GLUT5)","Transporte activo de potasio"],
  ok:1,
  exp:"La glucosa y la galactosa se absorben por cotransporte activo con sodio (SGLT1) en la membrana apical del enterocito. La fructosa lo hace por difusión facilitada (GLUT5)." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"La fructosa se absorbe principalmente por:",
  ops:["Cotransporte con sodio","Difusión facilitada","Transporte activo de calcio","Pinocitosis"],
  ok:1,
  exp:"La fructosa se absorbe por difusión facilitada (GLUT5), sin acoplarse al sodio. Dentro del enterocito se fosforila y luego se convierte en glucosa." },

{ cat:"Carbohidratos", tipo:"caso",
  q:"Niño con diarrea osmótica y pH fecal ácido. ¿Qué tipo de intolerancia es más probable?",
  ops:["Intolerancia a la lactosa","Intolerancia a las proteínas","Intolerancia a las grasas","Intolerancia al gluten"],
  ok:0,
  exp:"La intolerancia a la lactosa produce diarrea osmótica con pH fecal ácido por fermentación bacteriana de la lactosa no absorbida. Es frecuente en niños y adultos con deficiencia de lactasa." },

/* =========================================================
   DIGESTIÓN DE PROTEÍNAS (29-45)
   ========================================================= */
{ cat:"Proteínas", tipo:"teoria",
  q:"La digestión de las proteínas comienza en el estómago por acción de:",
  ops:["La tripsina","La pepsina","La quimotripsina","La carboxipeptidasa"],
  ok:1,
  exp:"La pepsina es una enzima péptica gástrica que alcanza su máxima actividad a pH 2-3 y se inactiva a pH >5. Degrada las proteínas en polipéptidos." },

{ cat:"Proteínas", tipo:"teoria",
  q:"La pepsina es más activa a un pH de:",
  ops:["7-8","2-3","5-6","9-10"],
  ok:1,
  exp:"La pepsina alcanza su máxima actividad a pH 2-3 y se inactiva a pH superior a 5. Por eso la digestión de proteínas en el estómago depende del ambiente ácido." },

{ cat:"Proteínas", tipo:"teoria",
  q:"La pepsina puede digerir especialmente:",
  ops:["El colágeno","La celulosa","El almidón","Los triglicéridos"],
  ok:0,
  exp:"La pepsina es capaz de digerir el colágeno, una albúmina que constituye el principal componente del tejido conectivo intercelular de las carnes." },

{ cat:"Proteínas", tipo:"teoria",
  q:"¿Qué porcentaje de la digestión de proteínas se produce en el estómago?",
  ops:["10-20%","50-60%","80-90%","5%"],
  ok:0,
  exp:"La pepsina proporciona solo el 10-20% de la digestión total de proteínas. La mayor parte ocurre en el intestino delgado por las enzimas pancreáticas." },

{ cat:"Proteínas", tipo:"teoria",
  q:"Las enzimas proteolíticas pancreáticas que actúan en el duodeno y yeyuno son:",
  ops:["Tripsina, quimotripsina, carboxipolipeptidasa y proelastasa","Pepsina y renina","Amilasa y lipasa","Lactasa y sacarasa"],
  ok:0,
  exp:"Las enzimas proteolíticas pancreáticas (tripsina, quimotripsina, carboxipolipeptidasa y proelastasa) degradan los restos de proteínas en el intestino delgado, liberando aminoácidos y pequeños péptidos." },

{ cat:"Proteínas", tipo:"teoria",
  q:"La tripsina y la quimotripsina degradan las moléculas proteicas en:",
  ops:["Pequeños polipéptidos","Monosacáridos","Ácidos grasos","Nucleótidos"],
  ok:0,
  exp:"La tripsina y la quimotripsina degradan las proteínas en pequeños polipéptidos, que luego son hidrolizados por peptidasas del borde en cepillo hasta aminoácidos libres." },

{ cat:"Proteínas", tipo:"teoria",
  q:"La absorción de aminoácidos en el enterocito utiliza:",
  ops:["Difusión simple","Cotransporte con sodio","Pinocitosis","Transporte activo de calcio"],
  ok:1,
  exp:"Los aminoácidos se absorben por cotransporte con sodio en la membrana apical del enterocito. Los dipéptidos y tripéptidos pueden absorberse por transporte de péptidos (PepT1)." },

{ cat:"Proteínas", tipo:"teoria",
  q:"La mayor parte de las proteínas absorbidas pasan a la circulación portal como:",
  ops:["Proteínas intactas","Aminoácidos libres","Péptidos grandes","Glucosa"],
  ok:1,
  exp:"Las proteínas se digieren hasta aminoácidos y pequeños péptidos, que se absorben y pasan a la vena porta. El hígado los utiliza para síntesis proteica y otras funciones." },

{ cat:"Proteínas", tipo:"teoria",
  q:"La hidrólisis final de los dipéptidos y tripéptidos ocurre en:",
  ops:["El estómago","El borde en cepillo del enterocito","El colon","La luz del íleon"],
  ok:1,
  exp:"Las peptidasas del borde en cepillo de los enterocitos realizan la hidrólisis final de los dipéptidos y tripéptidos en aminoácidos libres, que luego son absorbidos." },

{ cat:"Proteínas", tipo:"caso",
  q:"Paciente con gastrectomía total que presenta anemia megaloblástica. ¿Por qué ocurre?",
  ops:["Falta de factor intrínseco","Falta de ácido clorhídrico","Falta de pepsina","Falta de gastrina"],
  ok:0,
  exp:"La gastrectomía total elimina las células parietales que secretan factor intrínseco. Sin factor intrínseco, la vitamina B12 no puede absorberse en el íleon terminal, causando anemia megaloblástica." },

{ cat:"Proteínas", tipo:"teoria",
  q:"El factor intrínseco es esencial para la absorción de:",
  ops:["Hierro","Vitamina B12","Calcio","Ácido fólico"],
  ok:1,
  exp:"El factor intrínseco se une a la vitamina B12 y permite su absorción en el íleon terminal. Su deficiencia causa anemia perniciosa." },

{ cat:"Proteínas", tipo:"teoria",
  q:"La enterocinasa (enteroquinasa) se localiza en:",
  ops:["El estómago","El borde en cepillo del duodeno","El colon","El esófago"],
  ok:1,
  exp:"La enterocinasa es una enzima del borde en cepillo del duodeno que activa el tripsinógeno en tripsina, iniciando la cascada de activación de las enzimas pancreáticas." },

{ cat:"Proteínas", tipo:"caso",
  q:"Paciente con pancreatitis aguda que presenta dolor abdominal intenso y elevación de amilasa. ¿Qué mecanismo explica la elevación de amilasa?",
  ops:["Obstrucción del conducto pancreático","Aumento de la secreción gástrica","Deficiencia de lactasa","Aumento de la absorción intestinal"],
  ok:0,
  exp:"La pancreatitis aguda causa edema e inflamación que obstruyen el conducto pancreático, impidiendo el paso de las enzimas al duodeno. Las enzimas se liberan a la sangre, elevando la amilasa y la lipasa séricas." },

{ cat:"Proteínas", tipo:"teoria",
  q:"Las enzimas proteolíticas pancreáticas se secretan en forma de:",
  ops:["Enzimas activas","Precursores inactivos (zimógenos)","Cofactores","Hormonas"],
  ok:1,
  exp:"Las enzimas proteolíticas pancreáticas (tripsinógeno, quimotripsinógeno, procarboxipeptidasa) se secretan como zimógenos inactivos para evitar la autodigestión del páncreas." },

{ cat:"Proteínas", tipo:"teoria",
  q:"La tripsina se activa a partir de:",

const cont = document.getElementById('quiz');
const marcador = document.getElementById('marcador');
let respondidas = 0, aciertos = 0;

function actualizarMarcador() {
  marcador.textContent = `Respondidas: ${respondidas} / ${preguntas.length} · Aciertos: ${aciertos}`;
}

function responder(card, caja, exp, p, elegida) {
  if (card.dataset.respondida) return;
  card.dataset.respondida = "1";
  caja.querySelectorAll('.opcion').forEach((b, j) => {
    b.disabled = true;
    if (j === p.ok) b.classList.add('correcta');
    if (j === elegida && elegida !== p.ok) b.classList.add('incorrecta');
  });
  const acerto = elegida === p.ok;
  respondidas++;
  if (acerto) aciertos++;
  actualizarMarcador();
  exp.innerHTML = `<strong>${acerto ? '✅ ¡Correcto!' : '❌ Respuesta incorrecta.'}</strong> ${p.exp}`;
  exp.classList.add('visible');
}

function construir() {
  cont.innerHTML = "";
  respondidas = 0; aciertos = 0;
  actualizarMarcador();

  preguntas.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card ' + p.tipo;

    const cab = document.createElement('div');
    cab.className = 'cabecera';
    cab.innerHTML =
      `<div class="numero">${i + 1}</div>
       <span class="etiqueta ${p.tipo === 'caso' ? 'c' : 't'}">
         ${p.tipo === 'caso' ? 'Caso clínico' : 'Teoría'}
       </span>
       <span class="etiqueta materia">${p.cat}</span>`;
    card.appendChild(cab);

    const enun = document.createElement('p');
    enun.className = 'enunciado';
    enun.textContent = p.q;
    card.appendChild(enun);

    const caja = document.createElement('div');
    caja.className = 'opciones';
    const exp = document.createElement('div');
    exp.className = 'explicacion';

    p.ops.forEach((op, j) => {
      const b = document.createElement('button');
      b.className = 'opcion';
      b.innerHTML = `<span class="letra">${'ABCD'[j]}</span><span>${op}</span>`;
      b.addEventListener('click', () => responder(card, caja, exp, p, j));
      caja.appendChild(b);
    });

    card.appendChild(caja);
    card.appendChild(exp);
    cont.appendChild(card);
  });
}

preguntas.forEach((p, i) => {
  const max = Math.max(...p.ops.map(o => o.length));
  if (p.ops[p.ok].length === max) {
    console.warn(`Aviso Q${i+1}: la correcta es (o empata como) la más larga.`);
  }
});

construir();
</script>
