<script>
const preguntas = [

/* ============ PRINCIPIOS GENERALES (1-10) ============ */
{ cat:"Principios generales", tipo:"teoria",
  q:"¿Cuál es el proceso químico fundamental de la digestión de los macronutrientes?",
  ops:["Hidrólisis","Oxidación mitocondrial","Fermentación bacteriana colónica","Fosforilación oxidativa"],
  ok:0,
  exp:"La hidrólisis enzimática es el proceso químico básico de la digestión: las enzimas digestivas devuelven los iones H y OH del agua a los polímeros, separándolos en sus unidades constituyentes absorbibles." },

{ cat:"Principios generales", tipo:"teoria",
  q:"¿Cuál es el producto final de la digestión de los carbohidratos?",
  ops:["Maltosa y polisacáridos","Monosacáridos libres","Almidón parcialmente hidrolizado","Glucógeno hepático"],
  ok:1,
  exp:"La digestión de los carbohidratos termina en monosacáridos (glucosa, galactosa y fructosa), hidrosolubles, que se absorben de inmediato hacia la sangre portal." },

{ cat:"Principios generales", tipo:"teoria",
  q:"¿Qué enzima inicia la digestión del almidón en la cavidad bucal?",
  ops:["Amilasa pancreática","Maltasa intestinal","Ptialina salival","Lactasa del ribete"],
  ok:2,
  exp:"La ptialina (α-amilasa salival), secretada por la glándula parótida, inicia la hidrólisis del almidón en maltosa y polímeros pequeños de glucosa." },

{ cat:"Principios generales", tipo:"teoria",
  q:"¿Qué porcentaje del almidón ingerido se hidroliza en la boca antes de la deglución?",
  ops:["Aproximadamente 30%","Alrededor del 60%","Cerca del 90%","No más del 5%"],
  ok:3,
  exp:"En el momento de la deglución, no más del 5% de los almidones ingeridos se encuentran hidrolizados, porque el tiempo de contacto con la ptialina en la boca es muy breve." },

{ cat:"Principios generales", tipo:"teoria",
  q:"¿A qué pH se inactiva la amilasa salival en el estómago?",
  ops:["Por debajo de 4","Alrededor de 7,5","Cercano a 2 ácido","Superior a 9"],
  ok:0,
  exp:"La actividad de la amilasa salival desaparece cuando el pH gástrico desciende por debajo de 4, antes de que los alimentos se mezclen completamente con las secreciones gástricas." },

{ cat:"Principios generales", tipo:"teoria",
  q:"¿Cuál es la acción de la α-amilasa pancreática en el duodeno?",
  ops:["Degrada proteínas a aminoácidos","Hidroliza almidón en maltosa","Emulsiona triglicéridos dietéticos","Activa el tripsinógeno duodenal"],
  ok:1,
  exp:"La α-amilasa pancreática actúa en el duodeno y yeyuno proximal durante 15-30 minutos, hidrolizando el almidón en maltosa y polímeros pequeños de glucosa." },

{ cat:"Principios generales", tipo:"teoria",
  q:"¿Qué enzimas del ribete en cepillo hidrolizan los disacáridos?",
  ops:["Pepsina, tripsina, quimotripsina","Amilasa y lipasa pancreáticas","Lactasa, sacarasa, maltasa","Enterocinasa y carboxipeptidasa"],
  ok:2,
  exp:"Los enterocitos de las vellosidades contienen lactasa, sacarasa, maltasa y α-dextrinasa, que hidrolizan los disacáridos en monosacáridos absorbibles." },

{ cat:"Principios generales", tipo:"teoria",
  q:"¿Cuáles son los productos de la hidrólisis de la lactosa?",
  ops:["Glucosa y fructosa simples","Dos moléculas de glucosa","Fructosa y galactosa libres","Glucosa y galactosa"],
  ok:3,
  exp:"La lactasa intestinal hidroliza la lactosa en una molécula de glucosa y una de galactosa, que luego se absorben por cotransporte con sodio (SGLT1)." },

{ cat:"Principios generales", tipo:"teoria",
  q:"¿Qué monosacárido predomina en el producto final de la digestión de los carbohidratos?",
  ops:["Aproximadamente 80% glucosa","Alrededor del 10% cada uno","Cerca del 50% del total","Menos del 5% restante"],
  ok:0,
  exp:"La glucosa representa alrededor del 80% del producto final de la digestión de los carbohidratos; la galactosa y la fructosa rara vez aportan más del 10% cada una." },

{ cat:"Principios generales", tipo:"teoria",
  q:"¿Por qué la celulosa no se digiere en el ser humano?",
  ops:["Es un polímero demasiado grande","Falta de celulasa específica","El pH gástrico la destruye","Carece de enlaces hidrolizables"],
  ok:1,
  exp:"El ser humano carece de celulasa, la enzima que hidroliza los enlaces β-1,4 de la celulosa. Por eso llega intacta al colon y actúa como fibra dietética." },

/* ============ CARBOHIDRATOS (11-25) ============ */
{ cat:"Carbohidratos", tipo:"teoria",
  q:"¿Cómo se absorben la glucosa y la galactosa en el enterocito?",
  ops:["Difusión simple transepitelial","Difusión facilitada por GLUT5","Cotransporte con sodio (SGLT1)","Pinocitosis mediada por calcio"],
  ok:2,
  exp:"La glucosa y la galactosa se absorben por cotransporte activo con sodio (SGLT1) en la membrana apical del enterocito, aprovechando el gradiente de Na+ mantenido por la Na+/K+-ATPasa basolateral." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"¿Cómo se absorbe la fructosa en el enterocito?",
  ops:["Cotransporte activo con sodio","Difusión simple a favor de gradiente","Transporte activo de calcio","Difusión facilitada por GLUT5"],
  ok:3,
  exp:"La fructosa se absorbe por difusión facilitada a través del transportador GLUT5, sin acoplarse al sodio. Dentro del enterocito se fosforila y luego se convierte en glucosa." },

{ cat:"Carbohidratos", tipo:"caso",
  q:"Paciente adulto con diarrea osmótica y pH fecal ácido tras ingerir leche. ¿Qué mecanismo explica el cuadro?",
  ops:["Diarrea osmótica con pH ácido","Esteatorrea con heces acólicas","Aumento de la absorción de glucosa","Estreñimiento por falta de fibra"],
  ok:0,
  exp:"La deficiencia de lactasa impide hidrolizar la lactosa. La lactosa no absorbida fermenta en el colon, genera ácidos orgánicos (pH fecal ácido) y causa diarrea osmótica con distensión y gases." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"¿Qué enzima del ribete en cepillo hidroliza la sacarosa?",
  ops:["Lactasa intestinal del ribete en cepillo","Sacarasa del ribete","Maltasa duodenal enzimática","Amilasa pancreática duodenal"],
  ok:1,
  exp:"La sacarasa del ribete en cepillo hidroliza la sacarosa en una molécula de glucosa y una de fructosa, que luego se absorben." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"¿Cuál es la acción de la α-dextrinasa del ribete en cepillo?",
  ops:["Hidroliza lactosa en glucosa","Rompe sacarosa en monosacáridos","Hidroliza dextrinas límite","Activa la amilasa pancreática"],
  ok:2,
  exp:"La α-dextrinasa del ribete en cepillo hidroliza las dextrinas límite (polímeros de 3-9 residuos de glucosa) generadas por la amilasa pancreática, liberando glucosa libre absorbible." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"¿Cuál es la vía de los monosacáridos absorbidos en el intestino?",
  ops:["Circulación sistémica directa","Vasos linfáticos mesentéricos","Conducto torácico por quilomicrones","Vena porta al hígado"],
  ok:3,
  exp:"Los monosacáridos absorbidos atraviesan el enterocito y pasan a los capilares de las vellosidades; la sangre venosa los conduce por la vena porta al hígado, donde se metabolizan y almacenan." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"¿Dónde se localizan las enzimas del ribete en cepillo que digieren los disacáridos?",
  ops:["Vellosidades del enterocito","Criptas de Lieberkühn profundas","Luz del intestino delgado","Conductos pancreáticos distales"],
  ok:0,
  exp:"Las enzimas del ribete en cepillo (lactasa, sacarasa, maltasa, α-dextrinasa) se encuentran en la membrana apical de los enterocitos de las vellosidades intestinales." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"¿Qué porcentaje de los carbohidratos se digiere en el intestino delgado?",
  ops:["Aproximadamente 30%","Cerca del 95%","Alrededor del 60%","Menos del 50%"],
  ok:1,
  exp:"Prácticamente todos los carbohidratos ingeridos (95% o más) se digieren y absorben en el intestino delgado; solo una pequeña fracción escapa al colon." },

{ cat:"Carbohidratos", tipo:"caso",
  q:"Paciente con intolerancia a la lactosa. ¿Qué manifestación clínica es característica?",
  ops:["Esteatorrea con heces acólicas","Estreñimiento crónico severo","Intolerancia a la leche","Anemia megaloblástica por B12"],
  ok:2,
  exp:"La intolerancia a la lactosa se manifiesta por dolor abdominal, distensión, flatulencia y diarrea tras la ingesta de leche o derivados, por fermentación bacteriana de la lactosa no absorbida." },

{ cat:"Carbohidratos", tipo:"caso",
  q:"¿Cuál es la medida dietética inicial en la intolerancia a la lactosa?",
  ops:["Suplementos de amilasa pancreática","Restricción total de carbohidratos","Aumento de la ingesta de lactosa","Evitar la lactosa o usar lactasa"],
  ok:3,
  exp:"El tratamiento inicial consiste en reducir o evitar la lactosa de la dieta o administrar suplementos de lactasa exógena con los alimentos. La restricción total de carbohidratos no está indicada." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"¿Cuál es la función principal de la amilasa salival (ptialina)?",
  ops:["Hidroliza almidón en maltosa","Digiere proteínas en el estómago","Emulsiona triglicéridos de la dieta","Activa el pepsinógeno gástrico"],
  ok:0,
  exp:"La ptialina (α-amilasa salival) hidroliza el almidón y el glucógeno en maltosa y polímeros pequeños de glucosa; su acción se detiene en el estómago por el pH ácido." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"¿Qué proporción de los carbohidratos de la dieta corresponde a almidones?",
  ops:["Aproximadamente 10%","Más del 50%","Alrededor del 25%","Cerca del 75%"],
  ok:1,
  exp:"Los almidones constituyen más del 50% de los carbohidratos de la dieta habitual; la sacarosa y la lactosa aportan el resto, junto con pequeñas cantidades de glucógeno, alcohol y pectinas." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"¿Cuáles son las fuentes principales de carbohidratos en la dieta?",
  ops:["Carnes, pescados y huevos","Aceites vegetales y mantequilla","Sacarosa, lactosa y almidones","Verduras de hoja verde oscuro"],
  ok:2,
  exp:"Las fuentes más importantes de carbohidratos son la sacarosa (azúcar de caña), la lactosa (azúcar de la leche) y los almidones (polisacáridos de origen vegetal)." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"¿Cuál es la función del glucógeno hepático en el contexto digestivo?",
  ops:["Emulsiona grasas en el duodeno","Activa enzimas pancreáticas","Absorbe vitaminas liposolubles","Reserva de glucosa corporal"],
  ok:3,
  exp:"El glucógeno hepático es la reserva corporal de glucosa; se sintetiza a partir de los monosacáridos absorbidos y se moviliza entre comidas para mantener la glucemia." },

{ cat:"Carbohidratos", tipo:"teoria",
  q:"¿Cuál es la acción de la amilasa pancreática en el duodeno?",
  ops:["Hidroliza almidón por 15-30 min","Actúa durante varias horas","Permanece activa todo el tránsito","Se inactiva por el pH alcalino"],
  ok:0,
  exp:"La amilasa pancreática actúa en el duodeno y yeyuno proximal durante aproximadamente 15-30 minutos, antes de ser inactivada por las enzimas proteolíticas y el pH." },

/* ============ PROTEÍNAS (26-40) ============ */
{ cat:"Proteínas", tipo:"teoria",
  q:"¿Qué enzima inicia la digestión de las proteínas en el estómago?",
  ops:["Tripsina pancreática duodenal","Pepsina gástrica","Quimotripsina intestinal","Carboxipeptidasa pancreática"],
  ok:1,
  exp:"La pepsina gástrica, secretada como pepsinógeno y activada por el HCl, inicia la digestión de las proteínas en el estómago a pH 2-3, produciendo polipéptidos." },

{ cat:"Proteínas", tipo:"teoria",
  q:"¿Cuál es el pH de máxima actividad de la pepsina?",
  ops:["Cercano a 7 fisiológico","Alrededor de 5 duodenal","Entre 2 y 3","Superior a 9 alcalino"],
  ok:2,
  exp:"La pepsina alcanza su máxima actividad a pH 2-3 y se inactiva a pH superior a 5. Por eso la digestión gástrica de proteínas depende del ambiente ácido generado por las células parietales." },

{ cat:"Proteínas", tipo:"teoria",
  q:"¿Qué porcentaje de la digestión total de proteínas ocurre en el estómago?",
  ops:["Alrededor del 50-60% gástrico","Cerca del 80-90% proximal","Menos del 5% restante","Aproximadamente 10-20%"],
  ok:3,
  exp:"La pepsina proporciona solo el 10-20% de la digestión total de proteínas; la mayor parte ocurre en el intestino delgado por acción de las enzimas proteolíticas pancreáticas." },

{ cat:"Proteínas", tipo:"teoria",
  q:"¿Cuáles son las principales enzimas proteolíticas pancreáticas?",
  ops:["Tripsina, quimotripsina, elastasa","Pepsina, renina y gastricsina ácida","Lactasa, sacarasa, maltasa intestinal","Amilasa, lipasa y colipasa"],
  ok:0,
  exp:"Las enzimas proteolíticas pancreáticas son la tripsina, la quimotripsina, la elastasa y la carboxipolipeptidasa; se secretan como zimógenos y se activan en el duodeno." },

{ cat:"Proteínas", tipo:"teoria",
  q:"¿Cómo se activa el tripsinógeno pancreático en el duodeno?",
  ops:["Ácido clorhídrico gástrico en el estómago","Enterocinasa duodenal del ribete","Pepsina activa en el duodeno proximal","Bilis proveniente de la vesícula biliar"],
  ok:1,
  exp:"El tripsinógeno se activa por la enterocinasa (enteroquinasa) del ribete en cepillo del duodeno, que lo convierte en tripsina activa. La tripsina luego activa otras enzimas pancreáticas." },

{ cat:"Proteínas", tipo:"teoria",
  q:"¿Cuál es la función de la enterocinasa duodenal?",
  ops:["Emulsifica las grasas dietéticas","Neutraliza el quimo ácido duodenal","Activa tripsinógeno en tripsina","Estimula la secreción de secretina"],
  ok:2,
  exp:"La enterocinasa es una enzima del ribete en cepillo del duodeno que convierte el tripsinógeno en tripsina activa, iniciando la cascada de activación de las enzimas pancreáticas." },

{ cat:"Proteínas", tipo:"teoria",
  q:"¿Cómo se absorben los aminoácidos en el enterocito?",
  ops:["Difusión simple pasiva transepitelial","Difusión facilitada por GLUT5","Pinocitosis de macromoléculas","Cotransporte con sodio"],
  ok:3,
  exp:"Los aminoácidos se absorben por cotransporte con sodio en la membrana apical del enterocito. Los dipéptidos y tripéptidos lo hacen por el transportador de péptidos PepT1." },

{ cat:"Proteínas", tipo:"teoria",
  q:"¿Cuál es el producto final de la digestión de las proteínas?",
  ops:["Aminoácidos libres","Dipéptidos y tripéptidos","Polipéptidos pequeños","Proteínas intactas absorbibles"],
  ok:0,
  exp:"La digestión de las proteínas termina en aminoácidos libres (y algunos dipéptidos y tripéptidos), que se absorben y pasan por la vena porta al hígado." },

{ cat:"Proteínas", tipo:"teoria",
  q:"¿En qué segmento del tubo digestivo se absorbe la vitamina B12?",
  ops:["Duodeno proximal","Íleon terminal","Yeyuno medio","Colon ascendente"],
  ok:1,
  exp:"La vitamina B12 unida al factor intrínseco se absorbe en el íleon terminal mediante receptores específicos. La resección o enfermedad del íleon terminal causa deficiencia de B12." },

{ cat:"Proteínas", tipo:"teoria",
  q:"¿Cuál es la función del factor intrínseco secretado por las células parietales?",
  ops:["Activa pepsinógeno en pepsina","Neutraliza el ácido gástrico","Une vitamina B12 para absorción","Estimula la secreción de gastrina"],
  ok:2,
  exp:"El factor intrínseco se une a la vitamina B12 y permite su absorción en el íleon terminal mediante receptores específicos. Su ausencia causa anemia perniciosa." },

{ cat:"Proteínas", tipo:"caso",
  q:"¿Qué enfermedad se produce por falta de factor intrínseco?",
  ops:["Anemia ferropénica microcítica","Talasemia mayor congénita","Anemia megaloblástica por folato","Anemia perniciosa"],
  ok:3,
  exp:"La anemia perniciosa se debe a la destrucción autoinmune de las células parietales, que secretan factor intrínseco. Sin factor intrínseco, la vitamina B12 no se absorbe y aparece anemia megaloblástica." },

{ cat:"Proteínas", tipo:"caso",
  q:"Paciente con gastrectomía total. ¿Qué consecuencia digestiva es inevitable?",
  ops:["Déficit de factor intrínseco","Aumento de la secreción ácida","Disminución de la motilidad","Aumento de la absorción de hierro"],
  ok:0,
  exp:"La gastrectomía total elimina las células parietales que secretan factor intrínseco, por lo que la absorción de vitamina B12 queda comprometida y requiere suplementación parenteral de por vida." },

{ cat:"Proteínas", tipo:"teoria",
  q:"¿Cómo se secretan las enzimas proteolíticas pancreáticas?",

/* ============ LÓGICA ============ */
const cont = document.getElementById('quiz');
const marcador = document.getElementById('marcador');
let respondidas = 0, aciertos = 0;

function actualizarMarcador() {
  marcador.textContent = `Respondidas: ${respondidas} / ${preguntas.length} · Aciertos: ${aciertos}`;
}

function responder(card, caja, exp, p, elegida) {
  if (card.dataset.respondida) return;
  card.dataset.respondida = "1";
  caja.querySelectorAll('.opcion').forEach((b, j) => {
    b.disabled = true;
    if (j === p.ok) b.classList.add('correcta');
    if (j === elegida && elegida !== p.ok) b.classList.add('incorrecta');
  });
  const acerto = elegida === p.ok;
  respondidas++;
  if (acerto) aciertos++;
  actualizarMarcador();
  exp.innerHTML = `<strong>${acerto ? '✅ ¡Correcto!' : '❌ Respuesta incorrecta.'}</strong> ${p.exp}`;
  exp.classList.add('visible');
}

function construir() {
  cont.innerHTML = "";
  respondidas = 0; aciertos = 0;
  actualizarMarcador();

  preguntas.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card ' + p.tipo;

    const cab = document.createElement('div');
    cab.className = 'cabecera';
    cab.innerHTML =
      `<div class="numero">${i + 1}</div>
       <span class="etiqueta ${p.tipo === 'caso' ? 'c' : 't'}">
         ${p.tipo === 'caso' ? 'Caso clínico' : 'Teoría'}
       </span>
       <span class="etiqueta materia">${p.cat}</span>`;
    card.appendChild(cab);

    const enun = document.createElement('p');
    enun.className = 'enunciado';
    enun.textContent = p.q;
    card.appendChild(enun);

    const caja = document.createElement('div');
    caja.className = 'opciones';
    const exp = document.createElement('div');
    exp.className = 'explicacion';

    p.ops.forEach((op, j) => {
      const b = document.createElement('button');
      b.className = 'opcion';
      b.innerHTML = `<span class="letra">${'ABCD'[j]}</span><span>${op}</span>`;
      b.addEventListener('click', () => responder(card, caja, exp, p, j));
      caja.appendChild(b);
    });

    card.appendChild(caja);
    card.appendChild(exp);
    cont.appendChild(card);
  });
}

preguntas.forEach((p, i) => {
  const max = Math.max(...p.ops.map(o => o.length));
  if (p.ops[p.ok].length === max) {
    console.warn(`Aviso Q${i+1}: la correcta es (o empata como) la más larga.`);
  }
});

construir();
</script>
