{ cat:"Principios generales", tipo:"teoria",
  q:"¿Qué efecto tiene la estimulación parasimpática sobre la motilidad gastrointestinal?",

  ok:1,

{ cat:"Principios generales", tipo:"teoria",
  q:"¿Qué es el complejo motor migratorio (CMM)?",
  ops:["Ondas peristálticas de la fase posprandial","Patrón de motilidad del ayuno","Contracción tónica del esfínter pilórico","Secreción cíclica de ácido gástrico"],

{ cat:"Principios generales", tipo:"teoria",
  q:"¿Qué hormona inicia el complejo motor migratorio?",
  ops:["Gastrina","Secretina","Motilina","Colecistoquinina"],

{ cat:"Principios generales", tipo:"teoria",

{ cat:"Principios generales", tipo:"teoria",
  q:"¿Qué es la segmentación?",

{ cat:"Principios generales", tipo:"teoria",

{ cat:"Principios generales", tipo:"teoria",

{ cat:"Principios generales", tipo:"teoria",

/* ============ CONTROL NERVIOSO (21-40) ============ */

{ cat:"Control nervioso", tipo:"teoria",

  q:"¿Qué es el reflejo vago-vagal?",

  exp:"El reflejo gastrocólico es el aumento de la motilidad colónica (movimientos de masa) desencadenado por la distensión gástrica tras la ingesta, facilitando la defecación." },

{ cat:"Refuerzo", tipo:"teoria",
  q:"¿Qué es el reflejo enterogástrico?",
  ops:["Aumento de la motilidad gástrica por distensión","Inhibición de la motilidad gástrica por el duodeno","Contracción del píloro por el vago","Secreción ácida por la gastrina"],
  ok:1,
  exp:"El reflejo enterogástrico es la inhibición de la motilidad y la secreción gástrica desencadenada por la presencia de quimo en el duodeno (ácido, grasa, osmolaridad elevada)." },

{ cat:"Refuerzo", tipo:"teoria",
  q:"¿Qué es la relajación receptiva gástrica?",
  ops:["Contracción del píloro tras la ingesta","Aumento del volumen gástrico sin aumento de presión","Secreción ácida por distensión","Relajación del esfínter esofágico inferior"],
  ok:1,
  exp:"La relajación receptiva es un reflejo vagal que permite que el estómago se distienda y acomode el alimento sin un aumento significativo de la presión intragástrica." }

];

/* ============ LÓGICA ============ */
const cont = document.getElementById('quiz');
const marcador = document.getElementById('marcador');
let respondidas = 0, aciertos = 0;

function actualizarMarcador() {
  marcador.textContent = `Respondidas: ${respondidas} / ${preguntas.length} · Aciertos: ${aciertos}`;
}

function responder(card, caja, exp, p, elegida) {
  if (card.dataset.respondida) return;
  card.dataset.respondida = "1";
  caja.querySelectorAll('.opcion').forEach((b, j) => {
    b.disabled = true;
    if (j === p.ok) b.classList.add('correcta');
    if (j === elegida && elegida !== p.ok) b.classList.add('incorrecta');
  });
  const acerto = elegida === p.ok;
  respondidas++;
  if (acerto) aciertos++;
  actualizarMarcador();
  exp.innerHTML = `<strong>${acerto ? '✅ ¡Correcto!' : '❌ Respuesta incorrecta.'}</strong> ${p.exp}`;
  exp.classList.add('visible');
}

function construir() {
  cont.innerHTML = "";
  respondidas = 0; aciertos = 0;
  actualizarMarcador();

  preguntas.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card ' + p.tipo;

    const cab = document.createElement('div');
    cab.className = 'cabecera';
    cab.innerHTML =
      `<div class="numero">${i + 1}</div>
       <span class="etiqueta ${p.tipo === 'caso' ? 'c' : 't'}">
         ${p.tipo === 'caso' ? 'Caso clínico' : 'Teoría'}
       </span>
       <span class="etiqueta materia">${p.cat}</span>`;
    card.appendChild(cab);

    const enun = document.createElement('p');
    enun.className = 'enunciado';
    enun.textContent = p.q;
    card.appendChild(enun);

    const caja = document.createElement('div');
    caja.className = 'opciones';
    const exp = document.createElement('div');
    exp.className = 'explicacion';

    p.ops.forEach((op, j) => {
      const b = document.createElement('button');
      b.className = 'opcion';
      b.innerHTML = `<span class="letra">${'ABCD'[j]}</span><span>${op}</span>`;
      b.addEventListener('click', () => responder(card, caja, exp, p, j));
      caja.appendChild(b);
    });

    card.appendChild(caja);
    card.appendChild(exp);
    cont.appendChild(card);
  });
}

preguntas.forEach((p, i) => {
  const max = Math.max(...p.ops.map(o => o.length));
  if (p.ops[p.ok].length === max) {
    console.warn(`Aviso Q${i+1}: la correcta es (o empata como) la más larga.`);
  }
});

construir();
</script>
